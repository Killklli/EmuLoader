[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "emu-loader"
version = "0.1.0"
description = "Cross-platform emulator memory access library for N64 emulators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["emulator", "n64", "memory", "archipelago"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Killklli/EmuLoader"
