[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emu-loader"
version = "0.1.0"
description = "Cross-platform emulator memory access library for N64 emulators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["emulator", "n64", "memory", "archipelago"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["emu_loader*"]

[tool.setuptools.package-data]
emu_loader = ["emulators.json"]

[project.urls]
Homepage = "https://github.com/Killklli/EmuLoader"
